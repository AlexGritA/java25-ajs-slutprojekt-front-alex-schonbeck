<!DOCTYPE html>
<html lang="sv">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scrum Board</title>
</head>

<body>
  <div id="app">
    <div class="header">
      <h1>Scrum Board</h1>
      <button id="open-modal-btn" class="add-task-btn">+</button>
    </div>

    <div class="board">
      <div class="column">
        <h2>New</h2>
        <div id="new-tasks" class="task-list"></div>
      </div>
      <div class="column">
        <h2>Doing</h2>
        <div id="doing-tasks" class="task-list"></div>
      </div>
      <div class="column">
        <h2>Done</h2>
        <div id="done-tasks" class="task-list"></div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div id="task-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <button class="close-btn">&times;</button>
      <h2>Skapa ny task</h2>
      <form id="task-form">
        <input type="text" id="task-title" placeholder="Title" required />
        <textarea id="task-description" placeholder="Description" required></textarea>
        <select id="task-category" required>
          <option value="">Välj kategori</option>
          <option value="ux">UX</option>
          <option value="frontend">Frontend</option>
          <option value="backend">Backend</option>
        </select>
        <div class="modal-buttons">
          <button type="submit" class="btn-primary">Skapa task</button>
          <button type="button" class="btn-cancel" id="cancel-btn">Avbryt</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Assign person modal -->
  <div id="assign-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content assign-modal-content">
      <h3>Vem ska göra denna uppgift?</h3>
      <input type="text" id="assign-person-input" placeholder="Ange namn..." />
      <div class="modal-buttons">
        <button id="assign-ok-btn" class="btn-primary">OK</button>
        <button id="assign-cancel-btn" class="btn-cancel">Avbryt</button>
      </div>
    </div>
  </div>

  <!-- Delete confirm modal -->
<div id="delete-modal" class="modal hidden">
  <div class="modal-overlay"></div>
  <div class="modal-content assign-modal-content">
    <h3>Är du säker på att du vill radera denna uppgift?</h3>
    <div class="modal-buttons">
      <button id="delete-confirm-btn" class="btn-delete">Radera</button>
      <button id="delete-cancel-btn" class="btn-cancel">Avbryt</button>
    </div>
  </div>
</div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
